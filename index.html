<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TontiGo</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #131b26;
    color: white;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.auth-container {
    width: 100%;
    max-width: 400px;
}

.auth-card {
    background: #1b2432;
    border: 1px solid #283344;
    border-radius: 16px;
    padding: 30px 25px;
}

.logo {
    text-align: center;
    margin-bottom: 30px;
}

.logo i {
    font-size: 42px;
    color: #10b981;
    margin-bottom: 12px;
}

.logo h1 {
    font-size: 27px;
    font-weight: 700;
}

.logo p {
    color: #9ca3af;
    font-size: 13px;
    margin-top: 8px;
}

.input-group {
    margin-bottom: 20px;
}

.input-group label {
    display: block;
    font-size: 13px;
    margin-bottom: 9px;
    color: #d1d5db;
}

.input-group input {
    width: 100%;
    padding: 14px;
    background: #131b26;
    border: 1px solid #283344;
    border-radius: 9px;
    color: white;
    font-size: 14px;
    outline: none;
}

.input-group input:focus {
    border-color: #10b981;
}

.btn-submit {
    width: 100%;
    padding: 14px;
    background: #10b981;
    border: none;
    border-radius: 9px;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

.btn-submit:hover {
    background: #059669;
}

.btn-submit:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

#firebase-message {
    text-align: center;
    font-size: 13px;
    margin-top: 15px;
    line-height: 1.5;
}
</style>
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="logo">
            <i class="fas fa-users"></i>
            <h1>TontiGo</h1>
            <p>Veuillez rejoindre le groupe de réunion</p>
        </div>

        <form id="register-form">

            <div class="input-group">
                <label for="username">Nom d'utilisateur</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Non d'utilisateur"
                    required
                >
            </div>

            <div class="input-group">
                <label for="code">Code</label>
                <input
                    type="text"
                    id="code"
                    placeholder="Mode de passe"
                    required
                >
            </div>

            <button type="submit" class="btn-submit" id="submit-button">
                S'inscrire
            </button>

            <div id="firebase-message"></div>

        </form>

    </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

import {
    getDatabase,
    ref,
    push,
    set
} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js";


const firebaseConfig = {
    apiKey: "AIzaSyCzWLEumjMugttnXm0B6RW66B0_DdgT3NM",
    authDomain: "tontigo-9d906.firebaseapp.com",
    databaseURL: "https://tontigo-9d906-default-rtdb.firebaseio.com",
    projectId: "tontigo-9d906",
    storageBucket: "tontigo-9d906.firebasestorage.app",
    messagingSenderId: "691420961669",
    appId: "1:691420961669:web:523fad7e06c4f773b582ec",
    measurementId: "G-8L92C0XBQ4"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

const form = document.getElementById("register-form");
const message = document.getElementById("firebase-message");
const button = document.getElementById("submit-button");

form.addEventListener("submit", async (event) => {

    event.preventDefault();

    const username = document.getElementById("username").value.trim();
    const code = document.getElementById("code").value.trim();

    if (!username || !code) {
        message.style.color = "#ef4444";
        message.textContent = "Veuillez remplir tous les champs.";
        return;
    }

    button.disabled = true;
    button.textContent = "Enregistrement...";
    message.textContent = "";

    try {

        const userReference = push(ref(database, "users"));

        await set(userReference, {
            username: username,
            code: code,
            createdAt: Date.now(),
            status: "active"
        });

        message.style.color = "#10b981";
        message.textContent = "Inscription réussie ! Redirection vers le groupe TontiGo...";

        setTimeout(() => {
            window.location.href = "https://t.me/tontigo";
        }, 1000);

    } catch (error) {

        console.error("Erreur Firebase :", error);

        message.style.color = "#ef4444";
        message.textContent = "Échec de l'enregistrement : " + error.message;

        button.disabled = false;
        button.textContent = "S'inscrire";

    }

});

</script>

</body>
</html>
